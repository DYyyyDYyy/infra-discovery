[project]
name = "infra-discovery"
version = "0.1.0"
description = "Agentless software discovery (BMC Discovery-style) with a TPL-like rule DSL and a mini CMDB graph"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncssh>=2.24.1",
    "fastapi>=0.162.4",
    "lark>=1.3.1",
    "pydantic>=2.14.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
discover = "infra_discovery:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.170.15",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
files = ["src", "tests"]
strict = true
python_version = "3.12"

[[tool.mypy.overrides]]
module = ["asyncssh.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q --cov=infra_discovery --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]
markers = ["lab: needs the docker lab (make lab)"]
